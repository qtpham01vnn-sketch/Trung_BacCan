<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .industrial-bg {
            background-color: #f7f9fb;
            background-image: radial-gradient(#eceef0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        input:focus {
            outline: none;
            border-color: #9d4300 !important;
            box-shadow: 0 0 0 2px #ffdbca;
        }
        .login-tab-active {
            border-bottom: 4px solid #9d4300;
            color: #9d4300;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col industrial-bg">
<!-- Brand Header -->
<header class="w-full pt-12 pb-8 flex flex-col items-center justify-center px-gutter">
<div class="flex items-center gap-3 mb-2">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">construction</span>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight text-primary uppercase">Trung Bắc Cạn</h1>
</div>
<p class="font-label-md text-label-md text-on-surface-variant tracking-widest uppercase opacity-70">Infrastructure &amp; Earthworks</p>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-4 pb-20">
<div class="w-full max-w-md bg-surface-container-lowest border-2 border-on-surface p-8 shadow-[8px_8px_0px_0px_rgba(25,28,30,1)]">
<!-- Login Type Selector -->
<div class="flex border-b-2 border-surface-container-high mb-8">
<button class="flex-1 py-4 font-label-lg text-label-lg login-tab-active transition-all duration-200" id="tab-field" onclick="switchTab('field')">
                    FIELD WORKER
                </button>
<button class="flex-1 py-4 font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container transition-all duration-200" id="tab-office" onclick="switchTab('office')">
                    OFFICE STAFF
                </button>
</div>
<!-- Field Worker Form -->
<div class="space-y-6" id="form-field">
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant block">PHONE NUMBER</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant">smartphone</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border-2 border-on-surface font-body-lg text-body-lg focus:ring-0" placeholder="000-000-0000" type="tel"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant block">OTP CODE</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant">pin</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border-2 border-on-surface font-body-lg text-body-lg focus:ring-0" placeholder="Enter 6-digit code" type="text"/>
</div>
</div>
<div class="pt-4 space-y-4">
<button class="w-full h-[56px] bg-primary-container text-on-primary-fixed font-bold text-label-lg border-2 border-on-surface flex items-center justify-center gap-2 active:translate-y-1 active:translate-x-1 active:shadow-none transition-all shadow-[4px_4px_0px_0px_rgba(25,28,30,1)]">
                        GET OTP
                        <span class="material-symbols-outlined">send</span>
</button>
<button class="w-full h-[56px] bg-primary text-white font-bold text-label-lg border-2 border-on-surface flex items-center justify-center gap-2 active:translate-y-1 active:translate-x-1 active:shadow-none transition-all shadow-[4px_4px_0px_0px_rgba(25,28,30,1)]">
                        LOGIN TO SITE
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
<!-- Office Staff Form (Hidden by default) -->
<div class="hidden space-y-6" id="form-office">
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant block">EMAIL ADDRESS</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border-2 border-on-surface font-body-lg text-body-lg focus:ring-0" placeholder="name@trungbaccan.vn" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant block">PASSWORD</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant">lock</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border-2 border-on-surface font-body-lg text-body-lg focus:ring-0" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-4">
<button class="w-full h-[56px] bg-primary text-white font-bold text-label-lg border-2 border-on-surface flex items-center justify-center gap-2 active:translate-y-1 active:translate-x-1 active:shadow-none transition-all shadow-[4px_4px_0px_0px_rgba(25,28,30,1)]">
                        OFFICE LOGIN
                        <span class="material-symbols-outlined">login</span>
</button>
</div>
<p class="text-center font-label-md text-label-md text-primary font-bold cursor-pointer hover:underline">Forgot password?</p>
</div>
</div>
</main>
<!-- Visual Anchor / Hero Image (Industrial Vibe) -->
<section class="hidden lg:block fixed right-0 top-0 h-full w-1/3 z-[-1]">
<img class="h-full w-full object-cover opacity-20 grayscale brightness-125" data-alt="A high-contrast wide-angle photograph of heavy yellow construction excavators operating on a vast brown earthwork site under a bright morning sun. The lighting is crisp and natural, highlighting the metallic textures and rugged machinery. The atmosphere is professional and industrious, reflecting a high-efficiency construction environment with a clean, light-mode aesthetic dominated by earth tones and safety orange." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDjT-7DywBItj8bcnyez3F9KtwpvcBo9F8MjNQS4dQ5UG-j3fi_y7-UzSTs2sGYik8kDOxktprLtUAj1jBve-1Oh-eaGl0XjmT2CiiE46xmltRpjzsRFg5BeuqxpuMJYyQQDb-8u-ejRV2BCvWifiB_JxAtebhVfAp9ZOpAGIYXxZHryK2Egeu7JU5enGDW8QXZ_1CpPTrQP8n3gtkNqaADJTwAnva-TAIrUQ9ewNki7Z_r-E13TRtT9R-bPe9nKZN2fTxNiLMwhWo"/>
</section>
<!-- Footer - Offline Indicator -->
<footer class="fixed bottom-0 left-0 w-full p-4 flex justify-between items-center bg-surface-container-low border-t-2 border-on-surface">
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse border border-on-surface"></span>
<span class="font-label-md text-label-md text-on-surface uppercase font-bold tracking-tight">System Ready</span>
</div>
<div class="flex items-center gap-2 group cursor-help">
<span class="material-symbols-outlined text-on-surface-variant text-sm">cloud_off</span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Offline Mode Enabled</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm">info</span>
</div>
</footer>
<script>
        function switchTab(type) {
            const fieldForm = document.getElementById('form-field');
            const officeForm = document.getElementById('form-office');
            const fieldTab = document.getElementById('tab-field');
            const officeTab = document.getElementById('tab-office');

            if (type === 'field') {
                fieldForm.classList.remove('hidden');
                officeForm.classList.add('hidden');
                fieldTab.classList.add('login-tab-active');
                fieldTab.classList.remove('text-on-surface-variant');
                officeTab.classList.remove('login-tab-active');
                officeTab.classList.add('text-on-surface-variant');
            } else {
                officeForm.classList.remove('hidden');
                fieldForm.classList.add('hidden');
                officeTab.classList.add('login-tab-active');
                officeTab.classList.remove('text-on-surface-variant');
                fieldTab.classList.remove('login-tab-active');
                fieldTab.classList.add('text-on-surface-variant');
            }
        }
    </script>
</body></html>
