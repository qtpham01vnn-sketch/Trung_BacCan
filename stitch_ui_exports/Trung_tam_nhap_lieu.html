</button>
<!-- Large Focus Tile: Machine Hours -->
<button class="rugged-card col-span-2 md:col-span-3 flex flex-col items-center justify-center p-8 text-center group">
<div class="w-16 h-16 bg-secondary-container flex items-center justify-center rounded-full mb-4 border-2 border-on-surface group-hover:bg-tertiary-container transition-colors">
<span class="material-symbols-outlined text-secondary text-4xl filled-icon">settings_slow_motion</span>
</div>

</button>
<!-- Standard Tile: Vehicle Trips -->

</button>
<!-- Standard Tile: Work Volume -->

<div class="w-12 h-12 bg-surface-container-high flex items-center justify-center rounded-full mb-3 border-2 border-on-surface group-hover:bg-secondary-fixed transition-colors">

<script>
        // Micro-interaction: Ripple effect on cards
        document.querySelectorAll('.rugged-card').forEach(card => {
            card.addEventListener('click', function(e) {
                const ripple = document.createElement('div');
                ripple.classList.add('absolute', 'bg-white', 'opacity-20', 'rounded-full', 'animate-ping');
                ripple.style.width = '100px';
                ripple.style.height = '100px';
                ripple.style.left = `${e.offsetX - 50}px`;
                ripple.style.top = `${e.offsetY - 50}px`;
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // Simple vibration simulation for "Input"
        document.querySelector('.bg-primary-container').addEventListener('click', () => {
            if (window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        });
    </script>
