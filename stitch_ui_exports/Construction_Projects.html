<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-high dark:hover:bg-on-secondary-fixed-variant rounded-full transition-all active:opacity-80 active:scale-95">

</section>
<!-- Project List (Bento Grid Style) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">

<div>

</div>

</div>
</div>

<div class="flex justify-between items-start mb-4">
<div>

</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors">check_circle</span>
</div>
<div class="space-y-stack-sm">
<div class="flex justify-between items-center mb-1">
<span class="font-label-md text-on-surface-variant">Progress</span>
<span class="font-label-lg text-primary">100%</span>
</div>
<div class="w-full bg-surface-container-highest h-3 border border-on-surface">

</div>

<span class="font-label-md text-label-md">More</span>

<script>
    // Micro-interactions for cards
    document.querySelectorAll('.group').forEach(card => {
      card.addEventListener('mouseenter', () => {
        const bar = card.querySelector('.bg-primary-container');
        if(bar) bar.style.opacity = '0.9';
      });
      card.addEventListener('mouseleave', () => {
        const bar = card.querySelector('.bg-primary-container');
        if(bar) bar.style.opacity = '1';
      });
    });

    // Simple search filter simulation
    const searchInput = document.querySelector('input[type="text"]');
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      document.querySelectorAll('h3').forEach(title => {
        const card = title.closest('.bg-surface-container-lowest');
        if(card) {
          if(title.textContent.toLowerCase().includes(term)) {
            card.style.display = 'flex';
          } else {
            card.style.display = 'none';
          }
        }
      });
    });
  </script>
</body></html>
